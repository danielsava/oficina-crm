### CORS

# quarkus.http.cors.enabled=false
# quarkus.http.cors.origins=http://localhost:4200

# %dev.quarkus.http.cors.enabled=false

### Banco
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=123456
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/oficina-crm

### Hibernate
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.log.format-sql=true
%dev.quarkus.hibernate-orm.log.highlight-sql=true
%dev.quarkus.hibernate-orm.log.jdbc-warnings=true

# quarkus.hibernate-orm.database.generation=validate
# jakarta.persistence.schema-generation.database.action=validate


### Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-at-start=true
quarkus.flyway.schemas=core,iam
quarkus.flyway.default-schema=core
quarkus.flyway.create-schemas=true

### OpenAPI / Swagger UI
# Endpoint OpenAPI: /q/openapi (JSON) e /q/openapi?format=yaml
# Endpoint Swagger UI: /q/swagger-ui
# always-include=true publica o Swagger UI também em PROD.
# A restrição de acesso em PROD será feita futuramente via autenticação/autorização (ver ADR-0006).
quarkus.smallrye-openapi.info-title=Oficina CRM API
%dev.quarkus.smallrye-openapi.info-title=Oficina CRM API (dev)
%test.quarkus.smallrye-openapi.info-title=Oficina CRM API (test)
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API interna de administração do Oficina CRM (CRUD de entidades).
quarkus.smallrye-openapi.info-contact-name=Equipe Oficina CRM
quarkus.smallrye-openapi.info-license-name=Proprietária
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.title=Oficina CRM API
quarkus.swagger-ui.theme=original
