<div class="card">
    <p-toolbar styleClass="mb-4 gap-2">
        <ng-template #left>
            <h2 class="text-2xl font-semibold m-0">Clientes</h2>
        </ng-template>
        <ng-template #right>
            <p-button routerLink="novo" label="Novo Cliente" icon="pi pi-plus" class="mr-2" />
        </ng-template>
    </p-toolbar>

    <p-table 
        [value]="clientes()" 
        [loading]="carregando()"
        dataKey="id" 
        [rows]="10" 
        [paginator]="true"
        [stripedRows]="true"
        responsiveLayout="scroll"
        styleClass="p-datatable-sm"
    >
        <ng-template #header>
            <tr>
                <th pSortableColumn="nome">Nome <p-sortIcon field="nome" /></th>
                <th pSortableColumn="email">Email <p-sortIcon field="email" /></th>
                <th pSortableColumn="documento">Documento <p-sortIcon field="documento" /></th>
                <th>Ações</th>
            </tr>
        </ng-template>
        <ng-template #body let-cliente>
            <tr>
                <td>{{ cliente.nome }}</td>
                <td>{{ cliente.email }}</td>
                <td>{{ cliente.documento }}</td>
                <td>
                    <div class="flex gap-2">
                        <p-button icon="pi pi-pencil" [routerLink]="['editar', cliente.id]" severity="info" [rounded]="true" [text]="true" />
                        <p-button icon="pi pi-trash" (click)="excluir(cliente.id)" severity="danger" [rounded]="true" [text]="true" />
                    </div>
                </td>
            </tr>
        </ng-template>
        <ng-template #emptymessage>
            <tr>
                <td colspan="4" class="text-center p-4">Nenhum cliente encontrado.</td>
            </tr>
        </ng-template>
    </p-table>
</div>
