services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: oficina-crm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d oficina-crm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "5432:5432"
    #volumes:
      #- postgres_data:/var/lib/postgresql/data

#volumes:
  #postgres_data:
